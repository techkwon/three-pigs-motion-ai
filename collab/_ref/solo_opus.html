<!--
  아기 돼지 삼형제 2050 : 열돔 늑대가 온다 (현대적 재해석 모션그래픽)

  ■ 고른 현대적 주제: 기후 위기(폭염·열돔)와 공동체
    - 짚·나무·벽돌 집 → 「빨리·싸게」 얇은 조립식 집 / 「최신·편하게」 통유리 스마트홈 / 「천천히·오래」 단열·옥상정원·태양광·나무 그늘 집
    - 늑대 → 도시 위에 내려앉아 뜨거운 공기를 가두는 '열돔 늑대'(폭염)
    - 결말 → 셋째 혼자 살아남는 것이 아니라, 문을 열고 이웃과 함께 동네 전체를 시원하게 바꾼다

  ■ 장면 목록 (대략적인 시작 시간, 전체 약 88초)
    1. 0초   제목 - 아기 돼지 삼형제 2050
    2. 4.5초 시작 - 2050년 여름, 삼형제가 각자 집을 짓기로 함
    3. 11초  첫째 - 「빨리, 싸게!」 하루 만에 얇은 조립식 집
    4. 18초  둘째 - 「최신, 편하게!」 통유리 + 에어컨 5대 스마트홈
    5. 26초  셋째 - 「천천히, 오래!」 단열 벽·옥상 정원·태양광·그늘 나무 / 형들의 비웃음
    6. 36초  위기 - 열돔 늑대 등장, 기온 43°C
    7. 43초  첫째 집이 찜통이 됨 (실내 41°C) → 둘째 집으로 피함
    8. 49초  온 도시의 에어컨 → 전력 부족 → 정전, 유리 집은 온실처럼 달아오름 (실내 39°C)
    9. 57초  두 형이 셋째 집으로 피신, 실내 27°C
   10. 64초  반전 - 창밖의 더위에 지친 이웃들, 「우리 집만 시원해선 못 이겨」, 문을 엶
   11. 71초  결말 - 이웃과 함께 나무·태양광·쉼터, 다음 해 늑대가 머물지 못함
   12. 80초  메시지 카드 → 88초 끝, 다시 보기 버튼

  ■ 전하려는 메시지
    기후 위기라는 늑대는 혼자서는 피할 수 없다. 가장 튼튼한 집은 '나만 안전한 집'이 아니라
    미리, 함께 준비한 동네다. (나무 한 그루, 그늘 한 뼘, 열린 문 하나부터)
-->

    ['하루 만에 뚝딱!', 478, 450, 13.9, 17.4, YEL, DARK],
    ['통유리 벽', 800, 470, 20.6, 25.4, DARK, '#fff'],
    ['에어컨 5대', 1010, 395, 23.0, 25.4, DARK, '#fff'],
    ['말하면 척척 스마트홈', 800, 322, 23.4, 25.4, YEL, DARK],
    ['두꺼운 단열 벽', 1265, 488, 28.6, 31.9, DARK, '#fff'],
    ['옥상 정원', 1200, 414, 29.2, 31.9, DARK, '#fff'],
    ['태양광', 1335, 392, 29.9, 31.9, DARK, '#fff'],
    ['그늘 나무', 1470, 478, 30.6, 31.9, DARK, '#fff'],
    ['모두의 쉼터', 1260, 590, 73.6, 999, YEL, DARK]

  });

  // 실내 온도 배지
  var BADGES = [
    ['실내 41°C', '#e63946', 340, 486, 45.2, 49.2],
    ['실내 39°C', '#e63946', 800, 476, 54.6, 57.4],
    ['실내 27°C', '#2a9d8f', 1260, 392, 59.2, 64.4]
  ].map(function (b) {
    var g = mk($('badges'), pillSVG(b[0], 30, b[1], '#fff')); g.setAttribute('opacity', '0');

  });

  /* ---------- 자막 ---------- */
  var CAPS = [
    [0.8, 4.4, '옛날 옛적이 아니라, 아주 가까운 미래의 이야기예요.'],
    [4.8, 10.8, '2050년 여름을 앞두고, 아기 돼지 삼형제가 처음으로 각자 집을 짓기로 했어요.'],
    [11.2, 17.8, '첫째는 “빨리, 싸게!”를 외치며 하루 만에 얇은 조립식 집을 세웠어요.'],
    [18.2, 25.8, '둘째는 “최신, 편하게!” 통유리 벽에 에어컨 다섯 대, 말만 하면 다 되는 스마트홈을 지었어요.'],
    [26.2, 31.8, '셋째는 “천천히, 오래!” 두꺼운 벽을 쌓고, 지붕엔 정원과 태양광을, 집 앞엔 나무를 심었어요.'],
    [32.0, 35.8, '형들은 웃었어요. “그걸 언제 다 해? 우린 벌써 끝났는데!”'],
    [36.2, 42.8, '그해 8월, 도시 위에 ‘열돔 늑대’가 내려앉았어요. 뜨거운 공기를 가둔 채 꼼짝도 하지 않았죠.'],
    [43.2, 48.8, '늑대가 뜨거운 숨을 후— 불자, 첫째의 얇은 집은 금세 찜통이 되었어요.'],
    [49.2, 52.9, '둘째는 에어컨을 쌩쌩 틀었어요. 그런데 온 도시가 한꺼번에 에어컨을 켜자…'],
    [53.1, 56.8, '전기가 바닥나 정전! 유리 집은 온실처럼 달아올랐어요.'],
    [57.2, 63.8, '두 형은 셋째의 집으로 달려갔어요. 나무 그늘과 두꺼운 벽 덕분에 안은 여전히 시원했죠.'],
    [64.2, 70.8, '그런데 창밖엔 더위에 지친 이웃들이 있었어요. 셋째가 말했죠. “우리 집만 시원해선 늑대를 못 이겨.”'],
    [71.2, 75.6, '삼형제는 이웃과 함께 나무를 심고, 지붕마다 태양광을 달고, 모두의 쉼터를 열었어요.'],
    [75.8, 79.8, '다음 해 여름, 열돔 늑대는 이 동네에 오래 머물지 못했답니다.']
  ];
  var capEl = $('caption'), capIdx = -2;
  function updateCaption(t) {
    var idx = -1;
    for (var i = 0; i < CAPS.length; i++) if (t >= CAPS[i][0] && t < CAPS[i][1]) { idx = i; break; }
    if (idx === capIdx) return;
    capIdx = idx;
    if (idx >= 0) { capEl.textContent = CAPS[idx][2]; capEl.classList.add('on'); }
    else capEl.classList.remove('on');
  }

  /* ---------- 카메라 ---------- */
  var CAM = [[0,800,450,1],[11,800,450,1],[12.2,340,580,1.75],[17.6,340,580,1.75],[18.8,800,560,1.6],[25.6,800,560,1.6],
    [26.6,1260,580,1.75],[31.6,1260,580,1.75],[32.6,800,450,1],[43,800,450,1],[44,340,580,1.7],[48.6,340,580,1.7],
    [49.6,800,560,1.55],[56.8,800,560,1.55],[57.8,1100,500,1.3],[63.8,1100,500,1.3],[64.8,800,450,1]];
  var HUFFS = [[39.4, 42.6], [44.0, 46.8], [50.0, 52.8]];
  var OUT_T = 53.1;

  /* ---------- 요소 참조 ---------- */
  var E = {};
  ['skyTop','skyBot','sun','sunGlow','cloud1','cloud2','cloud3','world','skyWins','dome','ground','gedge','plot1','plot2','plot3',
   'h1','h1body','h1hot','h1fresh','h1heat','dust','h2','h2body','h2wins','h2glow','h2wifi','h2fresh','h2heat',
   'h3cliprect','h3faces','h3door','h3doorOpen','h3roof','h3solar','h3tree','shimmer','warm','dark','wolf','wolfO','wolfSmile',
   'wolfLabel','wolfEyeL','wolfEyeR','breath','puff','thermo','thMerc','thBulb','thLabel','thNum','power','powPct','powBar','powOut',
   'titleCard','endCard','ec1','ec2','ec3','ec4','flash','progress'].forEach(function (id) { E[id] = $(id); });

  var fanAng = 0;

  /* ---------- 한 장면 그리기 ---------- */
  function render(t, dt) {
    var heat = ease(prog(t, 36, 42)) * (1 - ease(prog(t, 71.5, 78)));
    var fresh = ease(prog(t, 71.5, 78));
    var outage = t >= OUT_T && t < 72.6;

    // 하늘·땅·해·구름
    E.skyTop.setAttribute('stop-color', col3(C.skyTop, heat, fresh));
    E.skyBot.setAttribute('stop-color', col3(C.skyBot, heat, fresh));
    E.ground.setAttribute('fill', col3(C.ground, heat, fresh));
    E.gedge.setAttribute('fill', col3(C.gedge, heat, fresh));
    E.sun.setAttribute('r', (70 + 48 * heat).toFixed(1));
    E.sun.setAttribute('fill', col3(C.sun, heat, fresh));
    E.sunGlow.setAttribute('r', (200 + 130 * heat).toFixed(1));
    op(E.sunGlow, 0.6 + 0.4 * heat);
    [[E.cloud1, 200, 140, 14], [E.cloud2, 1000, 230, 9], [E.cloud3, 620, 100, 18]].forEach(function (c) {
      var x = ((c[1] + t * c[3]) % 1900) - 150;
      tf(c[0], 'translate(' + x.toFixed(1) + ' ' + c[2] + ')');
      op(c[0], 0.9 * (1 - heat));
    });

    // 카메라
    var cam = kf(t, CAM, ease);
    tf(E.world, 'translate(800 450) scale(' + cam[2].toFixed(4) + ') translate(' + (-cam[0]).toFixed(2) + ' ' + (-cam[1]).toFixed(2) + ')');

    // 도시 창문(정전 때 꺼짐)
    E.skyWins.setAttribute('fill', outage ? '#4b5869' : '#fff3c4');

    // 열돔
    var domeIn = easeOut(prog(t, 37, 40)), domeOut = ease(prog(t, 74, 78));
    op(E.dome, domeIn * (1 - domeOut) * 0.95);
    popAt(E.dome, 800, 720, Math.max(0.001, domeIn));

    // 집터
    op(E.plot1, win(t, 4.6, 12.2, 0.5));
    op(E.plot2, win(t, 4.6, 19.0, 0.5));
    op(E.plot3, win(t, 4.6, 26.6, 0.5));

    // ---- 첫째 집 ----
    if (t < 11.8) op(E.h1, 0);
    else {
      op(E.h1, 1);
      tf(E.h1, 'translate(0 ' + (-460 * (1 - bounce(prog(t, 11.8, 13.0)))).toFixed(1) + ')');
    }
    var hot1 = ease(prog(t, 44.4, 47)) * (1 - fresh);
    var wob = win(t, 45.4, 49.6, 0.6) * 2.4 * Math.sin(t * 16);
    tf(E.h1body, 'translate(340 700) skewX(' + wob.toFixed(2) + ') translate(-340 -700)');
    op(E.h1hot, 0.5 * hot1);
    op(E.h1heat, 0.9 * hot1);
    tf(E.h1heat, 'translate(0 ' + (-((t * 40) % 30)).toFixed(1) + ')');
    var fr1 = ease(prog(t, 73.4, 74.4));
    op(E.h1fresh, fr1);
    var dustP = prog(t, 12.85, 13.9);
    op(E.dust, win(t, 12.85, 13.9, 0.15));
    popAt(E.dust, 340, 700, 0.6 + 0.8 * dustP);

    // ---- 둘째 집 ----
    var b2 = easeOut(prog(t, 18.8, 20.6));
    if (b2 <= 0) op(E.h2, 0);
    else { op(E.h2, 1); tf(E.h2body, 'translate(800 700) scale(1 ' + b2.toFixed(4) + ') translate(-800 -700)'); }
    var sp = 0;
    if (t >= 21.5 && t < 49.2) sp = 1.5;
    else if (t >= 49.2 && t < OUT_T) sp = 5;
    else if (t >= 74) sp = 0.6;
    fanAng = (fanAng + sp * 360 * dt) % 360;
    acEls.forEach(function (a, i) {
      var s = back(prog(t, 21.0 + i * 0.3, 21.5 + i * 0.3));
      if (s <= 0.001) { op(a.g, 0); return; }
      op(a.g, 1); popAt(a.g, a.x, a.y, s);
      a.blade.setAttribute('transform', 'rotate(' + fanAng.toFixed(1) + ' ' + a.x + ' ' + a.y + ')');
    });
    var wf = back(prog(t, 22.6, 23.1));
    op(E.h2wifi, wf > 0 ? 1 : 0);
    popAt(E.h2wifi, 800, 389, Math.max(0.001, wf));
    wifiArcs.forEach(function (el, i) {
      op(el, outage ? 0.15 : 0.55 + 0.45 * Math.sin(t * 5 - i * 1.2));
    });
    var winFill = '#9fe3ff';
    if (outage) winFill = '#2a3442';
    else if (t >= 49.2 && t < OUT_T && Math.sin(t * 40) > 0.6) winFill = '#d6f6ff';
    E.h2wins.setAttribute('fill', winFill);
    var hot2 = ease(prog(t, 53.6, 56.2)) * (1 - fresh);
    op(E.h2glow, 0.5 * hot2);
    op(E.h2heat, 0.9 * hot2);
    tf(E.h2heat, 'translate(0 ' + (-((t * 40) % 30)).toFixed(1) + ')');
    op(E.h2fresh, ease(prog(t, 73.0, 74.2)));

    // ---- 셋째 집 ----
    var pw = ease(prog(t, 26.4, 28.6));
    E.h3cliprect.setAttribute('y', (710 - 250 * pw).toFixed(1));
    E.h3cliprect.setAttribute('height', (250 * pw).toFixed(1));
    var rs = back(prog(t, 28.5, 29.2));
    op(E.h3roof, rs > 0 ? 1 : 0);
    tf(E.h3roof, 'translate(1260 474) scale(1 ' + Math.max(0.001, rs).toFixed(4) + ') translate(-1260 -474)');
    var sol = easeOut(prog(t, 29.2, 29.9));
    op(E.h3solar, sol);
    tf(E.h3solar, 'translate(0 ' + (-60 * (1 - sol)).toFixed(1) + ')');
    var ts = back(prog(t, 29.9, 31.0));
    op(E.h3tree, ts > 0 ? 1 : 0);
    tf(E.h3tree, 'translate(1460 700) scale(' + Math.max(0.001, ts).toFixed(4) + ')');
    op(E.h3faces, win(t, 60.6, 68.4, 0.3));
    var open = t >= 67.6;
    op(E.h3door, open ? 0 : 1);
    op(E.h3doorOpen, open ? 1 : 0);

    // ---- 새로 심은 나무·꽃 ----
    TREES.forEach(function (tr) {
      var s = back(prog(t, tr.t, tr.t + 0.7));
      op(tr.g, s > 0 ? 1 : 0);
      tf(tr.g, 'translate(' + tr.x + ' 700) scale(' + (0.85 * Math.max(0.001, s)).toFixed(4) + ')');
    });
    FLOWERS.forEach(function (f) {
      var s = back(prog(t, f.t, f.t + 0.5));
      op(f.g, s > 0 ? 1 : 0);
      tf(f.g, 'translate(' + f.x + ' 700) scale(' + Math.max(0.001, s).toFixed(4) + ')');
    });

    // 아지랑이
    op(E.shimmer, heat * 0.6);
    tf(E.shimmer, 'translate(0 ' + (-((t * 35) % 30)).toFixed(1) + ')');

    // ---- 이웃 ----
    var cv = ease(prog(t, 36.4, 38));
    CRIT.forEach(function (c) {
      op(c.g, cv);
      var bnc = Math.abs(Math.sin(t * 5 + c.i * 1.3)) * 12 * fresh;
      var face = c.i % 2 ? -1 : 1;
      var sy = 0.78 * (1 - 0.1 * heat);
      tf(c.g, 'translate(' + c.x + ' ' + (700 - bnc).toFixed(1) + ') scale(' + (0.78 * face) + ' ' + sy.toFixed(3) + ')');
      op(c.sw, heat);
    });

    // ---- 돼지 ----
    PIGS.forEach(function (p, i) {
      var x = kf(t, p.xk)[0];
      var o = kf(t, p.ok)[0];
      var dx = kf(t + 0.05, p.xk)[0] - kf(t - 0.05, p.xk)[0];
      var moving = Math.abs(dx) > 0.5;
      if (moving) p.face = dx > 0 ? 1 : -1;
      var bob = moving ? Math.abs(Math.sin(t * 14 + i)) * 9 : 0;
      var tilt = moving ? Math.sin(t * 14 + i) * 4 : 0;
      tf(p.g, 'translate(' + x.toFixed(1) + ' ' + (700 - bob).toFixed(1) + ') rotate(' + tilt.toFixed(2) + ') scale(' + (0.8 * p.face) + ' 0.8)');
      op(p.g, o);
      var s = p.sweat(t);
      op(p.sw, s);
      tf(p.sw, 'translate(0 ' + ((t * 24) % 10).toFixed(1) + ')');
    });

    // ---- 말풍선·라벨·배지 ----
    BUBS.forEach(function (b) {
      var o = win(t, b.a, b.b, 0.25);
      op(b.g, o);
      if (o > 0) tf(b.g, 'translate(' + b.x + ' ' + b.y + ') scale(' + (0.85 + 0.15 * easeOut(prog(t, b.a, b.a + 0.3))).toFixed(3) + ')');
    });
    var wbo = win(t, wolfBub.a, wolfBub.b, 0.25);
    op(wolfBub.g, wbo);
    tf(wolfBub.g, 'translate(' + wolfBub.x + ' ' + wolfBub.y + ') scale(' + (0.85 + 0.15 * easeOut(prog(t, wolfBub.a, wolfBub.a + 0.3))).toFixed(3) + ')');
    LABELS.forEach(function (l) {
      var o = win(t, l.a, l.b, 0.3);
      op(l.g, o);
      if (o > 0) tf(l.g, 'translate(' + l.x + ' ' + l.y + ') scale(' + Math.max(0.001, back(prog(t, l.a, l.a + 0.4))).toFixed(3) + ')');
    });
    BADGES.forEach(function (b) {
      var o = win(t, b.a, b.b, 0.3);
      op(b.g, o);
      if (o > 0) tf(b.g, 'translate(' + b.x + ' ' + b.y + ') scale(' + Math.max(0.001, back(prog(t, b.a, b.a + 0.4))).toFixed(3) + ')');
    });

    // ---- 늑대 ----
    var wIn = easeOut(prog(t, 37, 39.4)), wOut = ease(prog(t, 74.6, 78.6));
    var hs = 1, br = 0, puffO = 0;
    HUFFS.forEach(function (h, k) {
      var a = h[0], b = h[1];
      if (t >= a && t < a + 0.6) hs = 1 + 0.12 * ease(prog(t, a, a + 0.6));
      else if (t >= a + 0.6 && t < b) {
        hs = 1 + 0.12 * (1 - ease(prog(t, a + 0.6, a + 1.0)));
        var w = win(t, a + 0.6, b, 0.3);
        br = Math.max(br, w);
        if (k > 0) puffO = Math.max(puffO, w);
      }
    });
    var zf = kf(t, [[0, 0], [43, 0], [44, 1], [56.8, 1], [57.8, 0]], ease)[0]; // 집을 가까이 볼 때는 늑대를 작게, 위로
    var wsc = (0.6 + 0.4 * wIn) * (1 - 0.65 * wOut) * hs * (1 - 0.38 * zf);
    var wy = 150 + Math.sin(t * 1.6) * 8 - (1 - wIn) * 160 - wOut * 90 - 42 * zf;
    op(E.wolf, wIn * (1 - wOut));
    tf(E.wolf, 'translate(800 ' + wy.toFixed(1) + ') scale(' + wsc.toFixed(4) + ') rotate(' + (wOut * Math.sin(t * 12) * 8).toFixed(2) + ')');
    op(E.wolfO, br);
    op(E.wolfSmile, 1 - br);
    op(E.wolfLabel, win(t, 38.4, 43.0, 0.4));
    var eye = (Math.sin(t * 9) > 0.92) ? '#ffffff' : '#fff36b';
    E.wolfEyeL.setAttribute('fill', eye); E.wolfEyeR.setAttribute('fill', eye);
    op(E.breath, br * (1 - wOut));
    E.breath.setAttribute('stroke-dashoffset', (-t * 220 % 90).toFixed(1));
    op(E.puff, puffO);

    // 화면 색조
    op(E.warm, 0.14 * heat);
    op(E.dark, 0.22 * win(t, OUT_T, 56.9, 0.3));
    op(E.flash, t >= OUT_T && t < OUT_T + 0.5 ? 0.85 * (1 - prog(t, OUT_T, OUT_T + 0.5)) : 0);

    // 온도계
    op(E.thermo, win(t, 35.8, 80.4, 0.5));
    var T = lerp(33, 43, ease(prog(t, 36.2, 42)));
    T = lerp(T, 34, ease(prog(t, 75.8, 79.4)));
    var L = lerp(8, 54, clamp((T - 25) / 20, 0, 1));
    E.thMerc.setAttribute('y', (108 - L).toFixed(1));
    E.thMerc.setAttribute('height', (L + 4).toFixed(1));
    var hotC = T >= 38 ? '#e63946' : (T >= 35 ? '#f4a259' : '#2a9d8f');
    E.thMerc.setAttribute('fill', hotC); E.thBulb.setAttribute('fill', hotC); E.thNum.setAttribute('fill', hotC);
    E.thNum.textContent = Math.round(T) + '°C';
    var lbl = t >= 75.5 ? '다음 해 여름 · 우리 동네' : '바깥 기온';
    if (E.thLabel.textContent !== lbl) E.thLabel.textContent = lbl;

    // 전력 계기판
    op(E.power, win(t, 49.1, 57.2, 0.4));
    if (t < OUT_T) {
      var pp = lerp(0.55, 1.0, ease(prog(t, 49.4, 52.9)));
      if (t > 52.0) pp = Math.min(1, pp + Math.sin(t * 50) * 0.02);
      E.powBar.setAttribute('width', (316 * pp).toFixed(1));
      E.powBar.setAttribute('fill', rgb(mixA(hex('#52b788'), hex('#e63946'), clamp((pp - 0.55) / 0.4, 0, 1))));
      op(E.powBar, 1);
      E.powPct.textContent = Math.round(pp * 100) + '%';
      op(E.powOut, 0);
    } else {
      op(E.powBar, 0);
      E.powPct.textContent = '0%';
      op(E.powOut, Math.sin(t * 10) > -0.3 ? 1 : 0.35);
    }

    // 제목
    var tc = win(t, 0.2, 4.4, 0.6);
    op(E.titleCard, tc);
    popAt(E.titleCard, 800, 405, 0.94 + 0.06 * easeOut(prog(t, 0.2, 1.2)));

    // 마지막 메시지
    op(E.endCard, ease(prog(t, 80, 81)));
    [[E.ec1, 80.4], [E.ec2, 82.0], [E.ec3, 83.0], [E.ec4, 84.6]].forEach(function (e) {
      var o = easeOut(prog(t, e[1], e[1] + 0.8));
      op(e[0], o);
      tf(e[0], 'translate(0 ' + (24 * (1 - o)).toFixed(1) + ')');
    });

    updateCaption(t);
    E.progress.style.width = (clamp(t / DUR, 0, 1) * 100).toFixed(2) + '%';
  }

  /* ---------- 재생 제어 ---------- */
  var t = 0, playing = false, last = 0, raf = 0;
  var startOv = $('startOv'), endOv = $('endOv');

  function resetState() {
    fanAng = 0; capIdx = -2;
    PIGS.forEach(function (p) { p.face = 1; });
  }
  function frame(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    t += dt;
    if (t >= DUR) {
      t = DUR; render(t, dt); playing = false;
      endOv.classList.remove('hidden');
      $('replayBtn').focus({ preventScroll: true });
      return;
    }
    render(t, dt);
    raf = requestAnimationFrame(frame);
  }
  function play() {
    cancelAnimationFrame(raf);
    resetState();
    t = 0; playing = true;
    startOv.classList.add('hidden');
    endOv.classList.add('hidden');
    render(0, 0);
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  $('playBtn').addEventListener('click', play);
  $('replayBtn').addEventListener('click', play);

  render(0, 0);
})();
</script>
</body>
