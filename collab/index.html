<!--
  늑대가 된 여름 — 아기 돼지 삼형제, 그다음 이야기 (현대적 재해석 모션그래픽, 무음)

  ■ 현대적 주제: 폭염 시대의 주거와 공동체 (주거 · 기술의 쓰임 · 이웃 돌봄)
    - 짚·나무·벽돌 집 → 빨리 펼치는 얇은 조립 주택 / 냉방 기술을 믿는 통유리 집 / 이웃과 함께 고친 그늘·단열 집
    - 늑대 → 도시에 뜨거운 숨을 부는 '폭염 늑대'
    - 결말 → 셋째가 문을 열고, 첫째의 빠른 손·둘째의 센서·셋째의 관계가 모여 마당이 동네 쉼터가 된다

  ■ 장면 목록 (시작 시간, 전체 88초 · 한 거리 위를 카메라가 이동)
     0초  같은 출발 — 세 집터, 세 가지 선택
     4초  첫째의 속도 — 접이식 집을 펼침 (설치 60분)
    10초  둘째의 믿음 — 통유리 집, 실외기 3대 (실내 24°C)
    17초  셋째의 준비 — 이웃과 단열·그늘 보강, 첫째의 재촉 「아직도 해?」
    25초  폭염 늑대 — 바깥 33→43°C, 뜨거운 숨 세 줄
    31초  첫째 집의 한계 — 얇은 벽으로 열 스며듦 (실내 29→41°C)
    37초  첫 번째 피신 — 첫째가 둘째 집으로 달려감
    42초  냉방이 몰린 도시 — 팬 가속, 전력 사용률 57→88→100%
    48초  기술의 멈춤 — 정전, 팬 정지, 유리 집 달아오름 (24→39°C)
    52초  두 번째 피신 — 두 형이 셋째 집으로 달려감
    57초  안전한 방, 문밖의 이웃 — 셋째 실내 31°C, 지친 이웃 발견
    62초  결말을 바꾸는 문 — 셋째가 문을 활짝 엶
    66초  첫째의 재능 — 빠른 손으로 그늘막을 넓힘
    71초  둘째의 재능 — 센서로 더운 곳을 찾음 (바닥 48°C · 34°C)
    76초  셋째의 관계 — 이웃을 그늘 쉼터로 안내
    81초  다음 여름 — 세 집 모두 개선, 늑대는 원경으로 물러남
    84초  메시지 — 좋은 집의 조건은 / 함께 살아남는 것.

/* 전역 스페이스 : 버튼·입력에 초점이 있으면 기본 동작에 맡긴다 */

/* 움직임 줄이기 : 처음과 설정 변경 모두 반영 (재생 상태·t는 그대로) */

RM = !!(mq && mq.matches);
