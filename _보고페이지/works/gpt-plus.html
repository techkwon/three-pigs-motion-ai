<!--
제목: 마감 늑대와 빈칸 있는 집
현대적 주제: 끝없는 추가 요청과 생산성 경쟁, 함께 조절하는 일과 휴식.
장면: 0초 세 형제와 축제 / 7초 첫째의 꽉 찬 집 / 16초 둘째의 기계 /
25초 셋째의 빈칸 / 33초 마감 늑대와 첫 피신 / 43초 기계 과적과 두 번째 피신 /
53초 빈칸의 한계와 함께 멈춤 / 60초 장식 생략 합의 / 65초 기계 재사용과 분담 /
70초 휴식 확보 / 75초 필수 일 완료 / 78초 마감을 일정에 넣기 / 79.5초 결말. 총 84초.
메시지: 좋은 집에는, 함께 숨 쉴 빈칸이 있다.
-->

  const byId = id => document.getElementById(id);

  const dom = {world:byId('world'),story:byId('story'),cover:byId('cover'),deadline:byId('deadline'),hand:byId('deadline-hand'),banner:byId('intro-banner'),ending:byId('ending')};
  function el(tag, attrs={}, parent, text) {

    for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,String(value));

    if(kind===1) {el('circle',{cx:-20,cy:-133,r:15,fill:'none',stroke:C.ink,'stroke-width':3},head);el('circle',{cx:20,cy:-133,r:15,fill:'none',stroke:C.ink,'stroke-width':3},head);path(head,'M-5-133H5m-49-5h9m70 0h9',{fill:'none',stroke:C.ink,'stroke-width':3});}
    if(kind===2) {el('circle',{cx:27,cy:-42,r:10,fill:'#fffdf7',stroke:C.ink,'stroke-width':2},torso);path(torso,'M27-42v-6m0 6 4 2',{fill:'none','stroke-width':2});}

  function posePig(p,x,y,opts={}) {
    const {run=0,phase=0,left=0,right=0,worried=false,nod=0,look=0,sit=0,scale=1,reduced=false}=opts;

    windCards.forEach((node,i)=>{
      show(node,i<5);

    overload.forEach((node,i)=>{
      let enabled=false,x=0,y=0;
      if(t>=37.4&&t<43){enabled=t>=37.4+i*.075;x=430-180+(i%6)*67;y=274-Math.floor(i/6)*36+event(t,38.05,39.5,reduced)*183;}
      if(t>=47.2&&t<53){enabled=i<5&&t>=47.2+i*.13;x=1430+34+(i%4)*33;y=448-Math.floor(i/4)*37;}

    // Travel passes through a doorway; gait follows travelled distance and eases to rest.
    let p1x=310,p2x=1200,p3x=2665,p1y=592,p2y=592,p3y=592;
    const options=[{},{},{}];
    function walk(index,from,to,a,b) {

      p1y=lerp(592,604,sit);p2y=p1y;p3y=p1y;

    [[p1x,p1y],[p2x,p2y],[p3x,p3y]].forEach((pos,i)=>posePig(pigModels[i],...pos,{...options[i],reduced}));
    if(options[0].draw!==undefined)reach(pigModels[0],'right',lerp(306,500,options[0].draw)-p1x,391-p1y);
    if(t>=19&&t<20.7){const a=leverAngle*Math.PI/180;reach(pigModels[1],'right',1302+58*Math.sin(a)-p2x,548-58*Math.cos(a)-p2y);}
    if(t>=55.2&&t<57.2)reach(pigModels[2],'left',2535-p3x,451-p3y);

    show(finaleBunting,t>=79);opacity(finaleBunting,event(t,79,79.5,reduced));
    const current=cues.find(c=>t>=c[0]&&t<c[1])||cues[cues.length-1];
    if(ui.caption.textContent!==current[2])ui.caption.textContent=current[2];
    updateTime(t);
  }

  // Native controls and a single clock. RAF schedules draws, never counts elapsed time.
  let state='ready',storedTime=0,origin=0,raf=0,seeking=false,resumeAfterSeek=false;
  const clock=()=>clamp(storedTime+(state==='playing'?(performance.now()-origin)/1000:0),0,DURATION);
  const cancelFrame=()=>{if(raf){cancelAnimationFrame(raf);raf=0;}};
  function updateTime(t) {
    const whole=Math.floor(t),formatted=`${String(Math.floor(whole/60)).padStart(2,'0')}:${String(whole%60).padStart(2,'0')}`;
    if(ui.elapsed.textContent!==formatted)ui.elapsed.textContent=formatted;
    if(!seeking)ui.seek.value=String(t);
    const spoken=`${Math.floor(t/60)}분 ${Math.floor(t%60)}초 / 전체 1분 24초`;
    if(ui.seek.getAttribute('aria-valuetext')!==spoken)attr(ui.seek,'aria-valuetext',spoken);
  }
  function updateButton() {
    const label=state==='ready'?'재생':state==='playing'?'일시정지':state==='ended'?'다시 보기':'계속 보기';
    if(ui.label.textContent!==label)ui.label.textContent=label;
    ui.icon.textContent=state==='playing'?'Ⅱ':state==='ended'?'↻':'▶';
    attr(ui.play,'aria-label',label);
    ui.seek.disabled=state==='ready';
  }
  function finish() {
    cancelFrame();storedTime=DURATION;state='ended';render(DURATION);updateButton();
    ui.status.textContent='이야기가 끝났습니다. 다시 보기 버튼으로 처음부터 재생할 수 있습니다.';
  }
  function frame() {
    raf=0;if(state!=='playing')return;
    const t=clock();render(t);
    if(t>=DURATION){finish();return;}
    raf=requestAnimationFrame(frame);
  }
  function play() {
    cancelFrame();
    if(state==='ready'||state==='ended')storedTime=0;
    show(dom.cover,false);show(dom.story,true);
    state='playing';origin=performance.now();ui.status.textContent='재생 중';updateButton();render(storedTime);
    raf=requestAnimationFrame(frame);
  }
  function pause() {
    if(state!=='playing')return;
    storedTime=clock();cancelFrame();
    if(storedTime>=DURATION){finish();return;}
    state='paused';render(storedTime);updateButton();ui.status.textContent='일시정지';
  }
  function toggle() {if(state==='playing')pause();else play();}
  function beginSeek() {
    if(seeking||state==='ready')return;
    resumeAfterSeek=state==='playing';pause();seeking=true;
  }
  function seekToInput() {
    if(state==='ready')return;
    const requested=Number(ui.seek.value);
    if(!seeking)beginSeek();
    storedTime=clamp(requested,0,DURATION);
    state=storedTime===DURATION?'ended':'paused';
    render(storedTime);updateButton();
  }
  function endSeek() {
    if(!seeking)return;
    seeking=false;
    const resume=resumeAfterSeek;resumeAfterSeek=false;
    if(storedTime>=DURATION)finish();
    else if(resume)play();
    else {render(storedTime);updateButton();}
  }
  ui.play.addEventListener('click',toggle);
  ui.seek.addEventListener('pointerdown',beginSeek);
  ui.seek.addEventListener('input',seekToInput);
  ui.seek.addEventListener('change',endSeek);
  window.addEventListener('pointerup',endSeek);
  window.addEventListener('pointercancel',endSeek);
  ui.seek.addEventListener('blur',endSeek);
  ui.seek.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key))beginSeek();});
  ui.seek.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key))endSeek();});
  document.addEventListener('keydown',e=>{
    const target=e.target;
    if(e.code!=='Space'||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
    if(target instanceof Element&&target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]'))return;
    e.preventDefault();toggle();
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){resumeAfterSeek=false;endSeek();pause();}
  });
  const motionChanged=()=>{if(state!=='ready')render(clock());};
  if(media.addEventListener)media.addEventListener('change',motionChanged);else media.addListener(motionChanged);
  if(narrow.addEventListener)narrow.addEventListener('change',motionChanged);else narrow.addListener(motionChanged);
  const transcript=byId('transcript');
  cues.forEach(c=>{const p=document.createElement('p');p.textContent=c[2];transcript.appendChild(p);});
  updateButton();
})();
