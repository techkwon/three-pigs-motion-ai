    - 늑대 → 가면 화면으로 남의 얼굴·목소리를 흉내 내는 「흉내쟁이 늑대」
    - 굴뚝과 냄비 → 굴뚝으로 넣은 링크, 누르지 않고 신고·차단

function clock(){return baseT+(performance.now()-baseNow)/1000;}

  cur=t;render(t);if(!scrub){announce(t);}syncUI();

function play(from){
  if(from!==undefined){cur=from;}

}
