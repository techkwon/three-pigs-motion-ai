<script>
(function(){
'use strict';
const duration=84;
const chapters=[
{at:0,name:'세 가지 미래',lines:[[0,'도시에 도착한 아기 돼지 삼형제는, 각자의 집을 골랐다.'],[4,'첫째는 속도, 둘째는 기술, 셋째는 이웃을 믿었다.']]},
{at:8,name:'첫째의 선택',lines:[[0,'첫째는 한 시간 만에 펼치는 값싼 집을 샀다.'],[5,'“빨리 쉬고 싶어.” 하지만 얇은 벽은 햇볕을 막지 못했다.']]},
{at:18,name:'둘째의 선택',lines:[[0,'둘째는 앱으로 모든 것을 조절하는 집을 골랐다.'],[5,'“기술이 지켜 줄 거야.” 전기가 멈출 때는 생각하지 못했다.']]},
{at:28,name:'셋째의 선택',lines:[[0,'셋째는 이웃과 오래된 집을 고쳤다. 조금 더디게.'],[5,'지붕에 그늘을, 창문에 바람길을, 마당에 벤치를 만들었다.']]},
{at:38,name:'새로운 늑대',lines:[[0,'그해 여름, 늑대가 찾아왔다. 이름은 ‘폭염’.'],[5.5,'뜨거운 숨이 도시를 덮쳤다. 밤에도 열기는 빠져나가지 않았다.']]},
{at:49,name:'멈춘 도시',lines:[[0,'첫째의 방은 달아올랐다. 냉방이 몰리자 전기도 끊겼다.'],[5,'둘째의 앱도 멈췄다. 두 형제는 셋째의 마당으로 향했다.']]},
{at:59,name:'더하기의 시간',lines:[[0,'“우리도 도울게.” 첫째는 빠른 손으로 그늘막을 넓혔다.'],[3.8,'둘째는 배터리 센서로 열을 살폈고, 셋째는 이웃을 불렀다.'],[7.5,'서로의 재능이 모이자, 작은 마당이 동네의 쉼터가 되었다.']]},
{at:70,name:'문을 여는 집',lines:[[0,'형제들은 물을 나누고, 혼자 사는 이웃의 안부를 물었다.'],[4,'더위는 끝나지 않았다. 하지만 이제, 누구도 혼자가 아니었다.']]},
{at:78,name:'새로 쓴 결말',lines:[[0,'좋은 집은 혼자 버티는 요새가 아니라, 함께 살아남는 곳.']]}
];
const scenes=Array.from(document.querySelectorAll('.scene'));
const play=document.getElementById('play'),toggle=document.getElementById('toggle'),replay=document.getElementById('replay'),seek=document.getElementById('seek'),cover=document.getElementById('cover');
const caption=document.getElementById('captionText'),captionBox=document.getElementById('caption'),live=document.getElementById('liveCaption');
let elapsed=0,running=false,started=false,finished=false,anchor=0,raf=0,current=-1,lastLine='';
function format(seconds){const n=Math.floor(seconds);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function render(){
 let index=0;for(let i=1;i<chapters.length;i++){if(elapsed>=chapters[i].at)index=i;}
 if(index!==current){scenes.forEach((scene,i)=>scene.classList.toggle('active',i===index));current=index;document.getElementById('chapter').textContent=String(index+1).padStart(2,'0')+' / '+chapters[index].name;document.getElementById('captionNumber').textContent=String(index+1).padStart(2,'0');}
 const local=elapsed-chapters[index].at;let line=chapters[index].lines[0][1];for(const entry of chapters[index].lines){if(local>=entry[0])line=entry[1];}
 if(line!==lastLine){caption.textContent=line;live.textContent=line;lastLine=line;}
 document.getElementById('time').textContent=format(elapsed)+' / 01:24';seek.value=String(elapsed);seek.setAttribute('aria-valuetext',format(elapsed)+'，전체 1분 24초');
 captionBox.style.opacity=finished?'0':'1';document.getElementById('endSignature').setAttribute('opacity',finished?'1':'0');
}
function setRunning(value){running=value;document.body.classList.toggle('playing',value);toggle.textContent=value?'일시정지':'계속 보기';toggle.setAttribute('aria-label',value?'일시정지':'계속 보기');}
function frame(now){if(!running)return;elapsed=Math.min(duration,(now-anchor)/1000);if(elapsed>=duration){finished=true;setRunning(false);replay.hidden=false;toggle.disabled=true;render();replay.focus({preventScroll:true});return;}render();raf=requestAnimationFrame(frame);}
function start(){cancelAnimationFrame(raf);elapsed=0;current=-1;lastLine='';started=true;finished=false;cover.classList.add('hidden');cover.inert=true;replay.hidden=true;toggle.disabled=false;seek.disabled=false;setRunning(true);anchor=performance.now();render();raf=requestAnimationFrame(frame);toggle.focus({preventScroll:true});}
function pause(){elapsed=Math.min(duration,(performance.now()-anchor)/1000);setRunning(false);cancelAnimationFrame(raf);render();}
function resume(){anchor=performance.now()-elapsed*1000;setRunning(true);raf=requestAnimationFrame(frame);}
play.addEventListener('click',start);replay.addEventListener('click',start);
toggle.addEventListener('click',function(){if(!started||finished)return;if(running)pause();else resume();});
seek.addEventListener('input',function(){elapsed=Number(seek.value);finished=elapsed>=duration;replay.hidden=!finished;toggle.disabled=finished;anchor=performance.now()-elapsed*1000;if(finished){setRunning(false);cancelAnimationFrame(raf);}render();});
document.addEventListener('keydown',function(event){if(event.code==='Space'&&event.target===document.body){event.preventDefault();if(!started||finished)start();else toggle.click();}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&running)pause();});
render();
})();
</script>
